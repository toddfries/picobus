# httpd in front of picobus FastCGI.
# OpenBSD httpd glob "/*" does not match nested /api/... paths.
# Static /shared/* from htdocs; everything else rewrites to /index.html
# (that file must exist) and is handed to the hub.

prefork 2

server "picobus" {
	listen on 127.0.0.1 port 80
	root "/htdocs"
	location "/shared/*" {
		root "/htdocs"
	}
	location not found match ".*" {
		root "/htdocs"
		request rewrite "/index.html"
		fastcgi socket "/run/picoclaw/fcgi.sock"
	}
	location match ".*" {
		root "/htdocs"
		request rewrite "/index.html"
		fastcgi socket "/run/picoclaw/fcgi.sock"
	}
}
