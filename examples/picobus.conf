# picobus service config. Sourced by /usr/local/libexec/picobus.
# Leave a line unset to keep the default.

# PICOBUS_PRODUCT=picobus
# PICOBUS_COOKIE=PICOBUS
# PICOBUS_STATE=/var/picobus
# HUB_SOCK=/var/run/picoclaw/hub.sock
# HUB_GROUP=wheel
# FCGI_SOCK=/var/www/run/picoclaw/fcgi.sock
# SHARE_DIR=/usr/local/share/picobus
# PICOCLAW_HOME=/root/.picoclaw
# PICOBUS_LLM_ALIAS=default
# PicoClaw native WS translator (picobus-pico). id=host:port, comma-separated.
# Token files are $PICO_TOKEN_DIR/<id>, mode 0640, not in this conf.
# PICO_AGENTS=
# PICO_TOKEN_DIR=/var/picobus/secrets/pico
